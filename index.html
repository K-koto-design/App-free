<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Погода</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        background: linear-gradient(135deg, #4facfe, #00f2fe);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
    }

    .weather-container {
        background: rgba(255,255,255,0.15);
        backdrop-filter: blur(10px);
        padding: 30px;
        border-radius: 20px;
        width: 320px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    .city {
        font-size: 28px;
        font-weight: bold;
        margin-bottom: 10px;
    }

    .temp {
        font-size: 60px;
        font-weight: bold;
        margin: 10px 0;
    }

    .desc {
        font-size: 20px;
        margin-bottom: 20px;
        opacity: 0.9;
    }

    .details {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
        margin-top: 20px;
    }

    .card {
        background: rgba(255,255,255,0.2);
        padding: 15px;
        border-radius: 15px;
    }

    .label {
        font-size: 14px;
        opacity: 0.8;
    }

    .value {
        font-size: 18px;
        font-weight: bold;
        margin-top: 5px;
    }
</style>
</head>
<body>

<div class="weather-container">
    <div class="city" id="city"></div>
    <div class="temp" id="temp"></div>
    <div class="desc" id="desc"></div>

    <div class="details">
        <div class="card">
            <div class="label">Влажность</div>
            <div class="value" id="humidity"></div>
        </div>

        <div class="card">
            <div class="label">Ветер</div>
            <div class="value" id="wind"></div>
        </div>

        <div class="card">
            <div class="label">Давление</div>
            <div class="value" id="pressure"></div>
        </div>

        <div class="card">
            <div class="label">Ощущается как</div>
            <div class="value" id="feels"></div>
        </div>
    </div>
</div>

<script>
/*
    ===== ВПИСЫВАЙ ПОГОДУ ЗДЕСЬ =====
*/

const weatherData = {
    city: "Ориенбаум",
    temp: "-18°C",
    desc: "Ясно",
    humidity: "75%",
    wind: "0 м/с",
    pressure: "771 мм",
    feels: "-24°C"
};
      city: "Ивало",
    temp: "-2°C",
    desc: "Ясно",
    humidity: "64%",
    wind: "2 м/с",
    pressure: "754 мм",
    feels: "-1°C"
};
    city: "Минск",
    temp: "-21°C",
    desc: "Ясно",
    humidity: "89%",
    wind: "4 м/с",
    pressure: "770 мм",
    feels: "-30°C"
};

/*
    ===== НЕ ТРОГАЙ НИЖЕ ЕСЛИ НЕ НУЖНО =====
*/

document.getElementById("city").textContent = weatherData.city;
document.getElementById("temp").textContent = weatherData.temp;
document.getElementById("desc").textContent = weatherData.desc;
document.getElementById("humidity").textContent = weatherData.humidity;
document.getElementById("wind").textContent = weatherData.wind;
document.getElementById("pressure").textContent = weatherData.pressure;
document.getElementById("feels").textContent = weatherData.feels;
</script>

</body>
</html>
