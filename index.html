<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мониторинг Погоды</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            padding: 40px;
            font-family: 'Segoe UI', sans-serif;
            background: radial-gradient(circle at top, #1e3c72, #2a5298);
            min-height: 100vh;
            color: white;
            display: flex;
            justify-content: center;
        }

        #weather-container {
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            justify-content: center;
            max-width: 1200px;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 25px;
            width: 280px;
            transition: transform 0.3s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .card:hover {
            transform: translateY(-10px);
            background: rgba(255, 255, 255, 0.15);
        }

        .city-name {
            font-size: 1.6rem;
            font-weight: bold;
            margin-bottom: 5px;
            color: #fff;
        }

        .weather-desc {
            font-size: 1rem;
            opacity: 0.9;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .main-temp {
            font-size: 3.5rem;
            font-weight: 200;
            margin-bottom: 20px;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            font-size: 0.9rem;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 15px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .stat-item span {
            opacity: 0.6;
            font-size: 0.75rem;
            text-transform: uppercase;
        }

        .stat-item i {
            margin-right: 5px;
            color: #4facfe;
        }

        .feels-like {
            grid-column: span 2;
            margin-top: 5px;
            font-style: italic;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div id="weather-container">
        </div>

    <script>
        // Твои данные, которые ты можешь редактировать
        const weatherData = [
            {
                city: "Ораниенбаум",
                temp: "-18°C",
                desc: "Ясно",
                humidity: "75%",
                wind: "0 м/с",
                pressure: "771 мм",
                feels: "-24°C"
            },
            {
                city: "Ивало",
                temp: "-2°C",
                desc: "Ясно",
                humidity: "64%",
                wind: "2 м/с",
                pressure: "754 мм",
                feels: "-1°C"
            },
            {
                city: "Минск",
                temp: "-21°C",
                desc: "Ясно",
                humidity: "89%",
                wind: "4 м/с",
                pressure: "770 мм",
                feels: "-30°C"
            }
        ];

        const container = document.getElementById('weather-container');

        // Функция для отрисовки карточек
        weatherData.forEach(data => {
            const card = document.createElement('div');
            card.className = 'card';
            
            card.innerHTML = `
                <div class="city-name">${data.city}</div>
                <div class="weather-desc">
                    <i class="fas fa-sun"></i> ${data.desc}
                </div>
                <div class="main-temp">${data.temp}</div>
                <div class="stats">
                    <div class="stat-item">
                        <span>Ветер</span>
                        <div><i class="fas fa-wind"></i>${data.wind}</div>
                    </div>
                    <div class="stat-item">
                        <span>Влажность</span>
                        <div><i class="fas fa-droplet"></i>${data.humidity}</div>
                    </div>
                    <div class="stat-item">
                        <span>Давление</span>
                        <div><i class="fas fa-gauge-high"></i>${data.pressure}</div>
                    </div>
                    <div class="stat-item">
                        <span>Ощущается</span>
                        <div><i class="fas fa-termometer-half"></i>${data.feels}</div>
                    </div>
                </div>
            `;
            container.appendChild(card);
        });
    </script>
</body>
</html>
