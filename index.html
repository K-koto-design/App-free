<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyCast: Мониторинг погоды</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            padding: 40px;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: radial-gradient(circle at top, #1e3c72, #2a5298);
            min-height: 100vh;
            color: white;
            display: flex;
            justify-content: center;
        }

        #weather-container {
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            justify-content: center;
            max-width: 1200px;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 25px;
            width: 280px;
            cursor: pointer;
            transition: transform 0.3s ease, background 0.3s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .card:hover {
            transform: translateY(-10px);
            background: rgba(255, 255, 255, 0.15);
        }

        .city-name { font-size: 1.6rem; font-weight: bold; margin: 0; }
        .country-name { font-size: 0.9rem; opacity: 0.7; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px; }

        .weather-desc { font-size: 1.1rem; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; font-weight: 500; }
        .weather-desc i { font-size: 1.2rem; }
        
        /* Цвета иконок */
        .fa-sun { color: #ffd700; }
        .fa-snowflake { color: #e0f7fa; }
        .fa-cloud { color: #cfd8dc; }
        .fa-cloud-rain, .fa-droplet { color: #90caf9; }
        .fa-bolt, .fa-cloud-bolt { color: #ffeb3b; }
        .fa-wind { color: #b0bec5; }

        .main-temp { font-size: 3.5rem; font-weight: 200; margin-bottom: 20px; }

        .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; font-size: 0.9rem; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px; }
        .stat-item { display: flex; flex-direction: column; gap: 4px; }
        .stat-item span { opacity: 0.6; font-size: 0.75rem; text-transform: uppercase; }
        
        .trend-up { color: #4caf50; margin-left: 4px; font-size: 0.8rem; }
        .trend-down { color: #f44336; margin-left: 4px; font-size: 0.8rem; }

        /* Modal */
        #modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            display: none; justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 30px; padding: 30px; width: 90%; max-width: 400px; position: relative;
        }
        .close-btn { position: absolute; top: 20px; right: 20px; background: none; border: none; color: white; cursor: pointer; font-size: 1.5rem; }

        .forecast-container { margin-top: 25px; display: flex; justify-content: space-between; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 20px; }
        .forecast-item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    </style>
</head>
<body>

    <div id="weather-container"></div>

    <div id="modal-overlay" onclick="closeModal()">
        <div class="modal-card" onclick="event.stopPropagation()">
            <button class="close-btn" onclick="closeModal()">&times;</button>
            <div id="modal-body"></div>
            <div class="forecast-container" id="modal-forecast"></div>
        </div>
    </div>

    <script>
        const weatherData = [
            {
                city: "Ориенбаум",
                country: "Россия",
                temp: "-25°C",
                desc: "Ясно",
                humidity: "74%",
                wind: "0 м/с",
                pressure: "769 мм",
                pressureTrend: "down",
                feels: "-27°C",
                forecast: [
                    { time: "09:00", icon: "fa-sun", temp: "-25°C" },
                    { time: "12:00", icon: "fa-sun", temp: "-20°C" },
                    { time: "15:00", icon: "fa-cloud-sun", temp: "-18°C" },
                    { time: "18:00", icon: "fa-wind", temp: "-26°C" },
                    { time: "21:00", icon: "fa-wind", temp: "-28°C" }
                ]
            },
            {
                city: "Ивало",
                country: "Финляндия",
                temp: "-4°C",
                desc: "Ясно",
                humidity: "83%",
                wind: "0 м/с",
                pressure: "754 мм",
                pressureTrend: "up",
                feels: "-5°C",
                forecast: [
                    { time: "09:00", icon: "fa-cloud", temp: "-4°C" },
                    { time: "12:00", icon: "fa-sun", temp: "-2°C" },
                    { time: "15:00", icon: "fa-sun", temp: "-2°C" },
                    { time: "18:00", icon: "fa-cloud-moon", temp: "-5°C" },
                    { time: "21:00", icon: "fa-snowflake", temp: "-7°C" }
                ]
            },
            {
                city: "Минск",
                country: "Беларусь",
                temp: "-21°C",
                desc: "Ясно",
                humidity: "85%",
                wind: "0 м/с",
                pressure: "770 мм",
                pressureTrend: "",
                feels: "-22°C",
                forecast: [
                    { time: "09:00", icon: "fa-sun", temp: "-21°C" },
                    { time: "12:00", icon: "fa-sun", temp: "-17°C" },
                    { time: "15:00", icon: "fa-sun", temp: "-14°C" },
                    { time: "18:00", icon: "fa-moon", temp: "-22°C" },
                    { time: "21:00", icon: "fa-moon", temp: "-25°C" }
                ]
            },
            {
                city: "Астана",
                country: "Казахстан",
                temp: "-16°C",
                desc: "Метель",
                humidity: "64%",
                wind: "0 м/с",
                pressure: "755 мм",
                pressureTrend: "down",
                feels: "-16°C",
                forecast: [
                    { time: "09:00", icon: "fa-sun", temp: "-16°C" },
                    { time: "12:00", icon: "fa-sun", temp: "-15°C" },
                    { time: "15:00", icon: "fa-sun", temp: "-13°C" },
                    { time: "18:00", icon: "fa-moon", temp: "-20°C" },
                    { time: "21:00", icon: "fa-moon", temp: "-27°C" }
                ]
            }
        ];

        function getDynamicIcons(desc) {
            const d = desc.toLowerCase();
            if (d.includes('летний шторм')) return '<i class="fas fa-wind"></i><i class="fas fa-cloud-rain"></i>';
            if (d.includes('шторм')) return '<i class="fas fa-wind"></i><i class="fas fa-snowflake"></i><i class="fas fa-snowflake"></i>';
            if (d.includes('метель')) return '<i class="fas fa-snowflake"></i><i class="fas fa-snowflake"></i>';
            if (d.includes('снегопад')) return '<i class="fas fa-snowflake"></i>';
            if (d.includes('гроза')) return '<i class="fas fa-cloud-bolt"></i><i class="fas fa-droplet"></i>';
            if (d.includes('дождь')) return '<i class="fas fa-cloud-rain"></i>';
            if (d.includes('ветрено')) return '<i class="fas fa-wind"></i>';
            if (d.includes('облачно')) return '<i class="fas fa-cloud"></i>';
            return '<i class="fas fa-sun"></i>';
        }

        function getTrend(trend) {
            if (trend === 'up') return '<i class="fas fa-arrow-up trend-up"></i>';
            if (trend === 'down') return '<i class="fas fa-arrow-down trend-down"></i>';
            return '';
        }

        const container = document.getElementById('weather-container');

        weatherData.forEach((data, index) => {
            const card = document.createElement('div');
            card.className = 'card';
            card.onclick = () => openModal(index);
            card.innerHTML = `
                <div class="city-name">${data.city}</div>
                <div class="country-name">${data.country}</div>
                <div class="weather-desc">${getDynamicIcons(data.desc)} <span>${data.desc}</span></div>
                <div class="main-temp">${data.temp}</div>
                <div class="stats">
                    <div class="stat-item"><span>Давление</span><div>${data.pressure}${getTrend(data.pressureTrend)}</div></div>
                    <div class="stat-item"><span>Ветер</span><div>${data.wind}</div></div>
                    <div class="stat-item"><span>Влажность</span><div>${data.humidity}</div></div>
                    <div class="stat-item"><span>Ощущается</span><div>${data.feels}</div></div>
                </div>
            `;
            container.appendChild(card);
        });

        function openModal(index) {
            const data = weatherData[index];
            document.getElementById('modal-body').innerHTML = `
                <div class="city-name">${data.city}</div>
                <div class="country-name">${data.country}</div>
                <div class="main-temp" style="margin:10px 0">${data.temp}</div>
                <div class="weather-desc" style="justify-content:center">${getDynamicIcons(data.desc)} ${data.desc}</div>
                <div class="stats">
                    <div class="stat-item"><span>Давление</span><div>${data.pressure} ${getTrend(data.pressureTrend)}</div></div>
                    <div class="stat-item"><span>Влажность</span><div>${data.humidity}</div></div>
                    <div class="stat-item"><span>Ветер</span><div>${data.wind}</div></div>
                    <div class="stat-item"><span>Ощущается</span><div>${data.feels}</div></div>
                </div>
            `;
            
            const fCont = document.getElementById('modal-forecast');
            fCont.innerHTML = data.forecast.map(f => `
                <div class="forecast-item">
                    <span style="font-size:0.75rem; opacity:0.7">${f.time}</span>
                    <i class="fas ${f.icon}"></i>
                    <b>${f.temp}</b>
                </div>
            `).join('');
            
            document.getElementById('modal-overlay').style.display = 'flex';
        }

        function closeModal() { document.getElementById('modal-overlay').style.display = 'none'; }
    </script>
</body>
</html>
